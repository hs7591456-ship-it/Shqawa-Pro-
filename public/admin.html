<!DOCTYPE html>
<html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin SHQAWA PRO</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:20px}.box{max-width:500px;margin:auto;background:#000;padding:25px;border-radius:15px;border:1px solid #222}input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px}button{background:#ff0000;color:#fff;padding:14px;border:none;border-radius:50px;width:100%;font-weight:900;margin-top:15px;cursor:pointer}#preview{width:100%;display:none;border-radius:10px;margin-top:10px}</style>
</head><body><div class="box">
<h1 style="color:red">لوحة تحكم SHQAWA PRO 🔥</h1>
<select id="category"><option value="websites">💻 مواقع ومتاجر</option><option value="apps">📱 تطبيقات</option><option value="designs">🎨 تصاميم وبنرات</option></select>
<input id="title" placeholder="اسم المشروع">
<textarea id="desc" placeholder="وصف المشروع"></textarea>
<input type="file" id="file" accept="image/*">
<p id="status" style="color:red"></p>
<img id="preview">
<button id="publishBtn">نشر 🚀</button>
<p style="text-align:center;margin-top:15px"><a href="/" style="color:#aaa">شوف الموقع</a></p>
</div>
<script>
let imageUrl = "";
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const status = document.getElementById('status');

fileInput.addEventListener('change', ()=>{
  const file = fileInput.files[0];
  if(!file) return;
  status.innerText = "بيحمل الصورة...";
  const reader = new FileReader();
  reader.onload = (e)=>{
    imageUrl = e.target.result;
    preview.src = imageUrl;
    preview.style.display = 'block';
    status.innerText = "✅ الصورة جاهزة";
  };
  reader.readAsDataURL(file);
});

document.getElementById('publishBtn').addEventListener('click', async ()=>{
  if(!imageUrl) return alert('اختار صورة الاول يا شقاوة');
  if(!document.getElementById('title').value) return alert('اكتب اسم المشروع');

  status.innerText = "بينشر...";
  const body = {
    title: document.getElementById('title').value,
    desc: document.getElementById('desc').value,
    image: imageUrl,
    category: document.getElementById('category').value,
    date: Date.now()
  };

  const res = await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.ok){
    alert('اتنشر يا وحش في قسم '+body.category);
    location.href = '/';
  } else {
    status.innerText = "حصل خطأ، الصورة كبيرة اوي جرب صورة اصغر";
  }
});
</script></body></html>
