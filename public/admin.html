<!DOCTYPE html>
<html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin SHQAWA PRO</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:20px}.box{max-width:600px;margin:auto;background:#000;padding:25px;border-radius:15px;border:1px solid #222}input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px}button{background:#ff0000;color:#fff;padding:14px;border:none;border-radius:50px;width:100%;font-weight:900;margin-top:15px;cursor:pointer}#preview{max-width:100%;display:none;border-radius:10px;margin-top:10px;border:1px solid #333}#info{color:#888;font-size:12px;margin-top:5px}</style>
</head><body><div class="box">
<h1 style="color:red">لوحة تحكم SHQAWA PRO</h1>
<p style="color:#666;font-size:13px">الرفع هيبقى بالمقاس الأصلي 100% من غير تصغير</p>
<select id="category"><option value="websites">💻 مواقع ومتاجر</option><option value="apps">📱 تطبيقات</option><option value="designs">🎨 تصاميم وبنرات</option></select>
<input id="title" placeholder="اسم المشروع">
<textarea id="desc" placeholder="وصف المشروع"></textarea>
<input type="file" id="file" accept="image/*">
<p id="info"></p>
<img id="preview">
<p id="status" style="color:red"></p>
<button id="btn">نشر بالمقاس الأصلي 🚀</button>
</div>
<script>
let imageUrl = "";
document.getElementById('file').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;

  // نعرض المقاس الأصلي
  const img = new Image();
  img.onload = function(){
    document.getElementById('info').innerText = `المقاس الأصلي: ${this.width} x ${this.height} - الحجم: ${(file.size/1024/1024).toFixed(2)} ميجا - هيترفع بنفس المقاس`;
  };

  const reader = new FileReader();
  reader.onload = (e)=>{
    imageUrl = e.target.result; // ده الأصلي 100% من غير اي تعديل
    img.src = imageUrl;
    document.getElementById('preview').src = imageUrl;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('status').innerText = "✅ جاهزة بالمقاس الأصلي";
  };
  reader.readAsDataURL(file);
});

document.getElementById('btn').addEventListener('click', async ()=>{
  if(!imageUrl) return alert('اختار صورة');
  const body = {title:document.getElementById('title').value, desc:document.getElementById('desc').value, image:imageUrl, category:document.getElementById('category').value, date:Date.now()};
  document.getElementById('status').innerText = "بينشر...";
  const res = await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.ok){ alert('اتنشر بنفس المقاس يا وحش 🔥'); location.href='/'; }
});
</script></body></html>
