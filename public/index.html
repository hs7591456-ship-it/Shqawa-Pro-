<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHQAWA PRO</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}header{padding:20px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #111}.logo{color:#ff0000;font-weight:900;font-size:26px}.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px 5%}.cat{background:#0a0a0a;border:1px solid #222;padding:40px;border-radius:20px;text-align:center;text-decoration:none;color:#fff}.cat h2{color:#ff0000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;padding:20px 5%}.card{border:1px solid #222;border-radius:15px;overflow:hidden;background:#0a0a0a}.card img{width:100%;height:200px;object-fit:cover}</style>
</head><body>
<header><div class="logo">SHQAWA PRO</div><div>01020427153</div></header>
<div style="text-align:center;padding:60px 5%"><h1 style="font-size:45px">بحول فكرتك لـ <span style="color:red">موقع بيجيب فلوس</span></h1></div>
<div class="cats">
<a href="websites.html" class="cat"><h2>💻 المواقع والمتاجر</h2><p>شوف كل شغلي</p></a>
<a href="apps.html" class="cat"><h2>📱 التطبيقات</h2><p>شوف كل شغلي</p></a>
<a href="designs.html" class="cat"><h2>🎨 التصاميم</h2><p>شوف كل شغلي</p></a>
</div>
<h2 style="padding:0 5%;color:red">🔥 آخر أعمالي</h2>
<div class="grid" id="last"></div>
<script>
fetch('/api/projects').then(r=>r.json()).then(data=>{
 document.getElementById('last').innerHTML=data.slice(0,6).map(p=>`<div class="card"><img src="${p.image}"><div style="padding:15px"><h3>${p.title}</h3><small style="color:#aaa">${p.category}</small></div></div>`).join('') || '<p style="color:#555;padding:0 5%">لسه مفيش شغل ارفع من /admin.html</p>';
});
</script>
</body></html>
