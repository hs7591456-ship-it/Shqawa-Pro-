*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#000;color:#fff}

</div>
</div>

<a class="whats" href="https://wa.me/201020427153">واتساب: 01020427153</a>

<script>
async function loadProjects(){
  try{
    const res = await fetch('/api/projects');
    const data = await res.json();
    const grid = document.getElementById('projectsGrid');
    if(data.length==0){
      grid.innerHTML = '<p style="color:#555">لسه مفيش مشاريع، ارفع من لوحة التحكم /admin.html</p>';
      return;
    }
    grid.innerHTML = data.map(p=>`
      <div class="proj">
        <img src="${p.image}" onerror="this.src='https://via.placeholder.com/400x220/111/ff0000?text=SHQAWA+PRO'">
        <div class="info">
          <h3>${p.title}</h3>
          <p style="color:#aaa;font-size:13px;margin-top:5px">${p.desc}</p>
        </div>
      </div>
    `).join('');
  }catch(e){console.log(e)}
}
loadProjects();
</script>
