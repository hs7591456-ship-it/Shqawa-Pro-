<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المواقع - SHQAWA PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#000;color:#fff}
.top{padding:15px 4%;display:flex;gap:10px;align-items:center;position:sticky;top:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);z-index:10}
.top a{color:#fff;text-decoration:none;background:#111;padding:8px 15px;border-radius:20px;border:1px solid #222;font-size:13px}
h1{padding:20px 4%;font-size:24px}
h1 span{color:#ff0000}
.hero-bg{height:25vh;background:radial-gradient(circle, rgba(255,0,0,0.3), #000), url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1000') center/cover;margin:0 4%;border-radius:20px;border:1px solid #222}
.grid{padding:15px 4%;display:grid;grid-template-columns:1fr;gap:15px}
.card{background:#0a0a0a;border:1px solid #222;border-radius:18px;overflow:hidden}
.card img{width:100%;height:230px;object-fit:cover}
.card .info{padding:12px}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head><body>
<div class="top"><a href="/">← الرئيسية</a><span style="color:#555">/</span><span style="color:red">المواقع</span></div>
<h1>💻 مشاريع <span>المواقع والمتاجر</span></h1>
<div class="hero-bg"></div>
<div class="grid" id="grid"></div>
<script>
const MY_CATEGORY = "designs"; // في apps.html خليها apps وفي designs.html خليها designs
fetch('/api/projects').then(r=>r.json()).then(data=>{
  const filtered = data.filter(p=>p.category===MY_CATEGORY);
  document.getElementById('grid').innerHTML = filtered.map(p=>`<div class="card"><img src="${p.image}"><div class="info"><h3>${p.title}</h3><p style="color:#aaa;font-size:12px">${p.desc}</p></div></div>`).join('') || '<p style="color:#666;padding:20px">لسه مفيش مشاريع هنا، ارفع من لوحة التحكم واختار القسم ده</p>';
});
</script>
</body></html>
